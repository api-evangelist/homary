name: Homary
description: >-
  Homary is a direct-to-consumer home furnishings retailer that sells furniture, faucets,
  lighting, outdoor, kitchen, bath, storage and organization, decor and rugs sourced straight
  from manufacturers to shoppers' homes. The brand positions itself around "affordable luxury"
  home decor, operating an online storefront (homary.com) with category catalogs, deals, best
  sellers, a design service, and a business-to-business program. Homary was surfaced through the
  API Evangelist network as a portfolio company of Lightspeed Venture Partners. As a consumer
  e-commerce brand it exposes only internal storefront endpoints (/hm-api/, /chart-api/, disallowed
  in robots.txt) and publishes no public developer API, SDKs, or API documentation at this time.
